<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 貪吃蛇遊戲 - Snake Game Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 頁面標題 -->
        <header class="header">
            <h1>🐍 貪吃蛇遊戲</h1>
            <p class="subtitle">Snake Game Online</p>
        </header>

        <!-- 主要遊戲區域 -->
        <main class="game-section">
            <!-- 遊戲控制面板 -->
            <div class="control-panel">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">得分</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最高分</span>
                        <span class="stat-value" id="highScore">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">難度</span>
                        <span class="stat-value" id="difficulty">簡單</span>
                    </div>
                </div>

                <div class="difficulty-selector">
                    <label for="difficultySelect">選擇難度：</label>
                    <select id="difficultySelect">
                        <option value="easy">簡單 (速度: 7)</option>
                        <option value="medium">中等 (速度: 12)</option>
                        <option value="hard">困難 (速度: 18)</option>
                        <option value="extreme">極難 (速度: 25)</option>
                    </select>
                </div>
            </div>

            <!-- 遊戲畫布 -->
            <div class="canvas-container">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                <div class="game-overlay" id="gameOverlay">
                    <div class="overlay-content">
                        <h2 id="overlayTitle">準備好了嗎？</h2>
                        <p id="overlayMessage">點擊「開始遊戲」或按下任意方向鍵開始</p>
                        <button id="startBtn" class="btn btn-primary">開始遊戲</button>
                    </div>
                </div>
            </div>

            <!-- 控制按鈕 -->
            <div class="button-group">
                <button id="pauseBtn" class="btn btn-secondary" disabled>暫停</button>
                <button id="resetBtn" class="btn btn-secondary">重新開始</button>
            </div>

            <!-- 鍵盤控制提示 -->
            <div class="instructions">
                <h3>🎮 控制方式</h3>
                <div class="control-hints">
                    <div class="hint">
                        <span class="key">↑ ↓ ← →</span>
                        <span class="description">移動蛇</span>
                    </div>
                    <div class="hint">
                        <span class="key">SPACE</span>
                        <span class="description">暫停/繼續</span>
                    </div>
                    <div class="hint">
                        <span class="key">R</span>
                        <span class="description">重新開始</span>
                    </div>
                </div>
            </div>

            <!-- 遊戲說明 -->
            <div class="rules">
                <h3>📋 遊戲規則</h3>
                <ul>
                    <li>🐍 控制蛇吃掉食物（🍎），每次得 10 分</li>
                    <li>📈 吃掉食物後蛇會變長</li>
                    <li>💥 撞牆或咬到自己遊戲結束</li>
                    <li>⚡ 難度越高，蛇的移動速度越快</li>
                    <li>🏆 挑戰高分，看看你能達到多少分！</li>
                </ul>
            </div>
        </main>

        <!-- 頁面頁腳 -->
        <footer class="footer">
            <p>由 h39372-cpu 製作 | <a href="https://github.com/h39372-cpu/snake-game-61410134" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
